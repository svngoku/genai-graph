# ---------------------------------------------------------------------------
# Generic data-injection workflows  (DSL v2)
# ---------------------------------------------------------------------------
# Domain-agnostic document -> Markdown -> KG pipeline. `markdownize_documents`
# handles directories, .zip archives, and files (raw Office/PDF/images or
# pre-existing Markdown) in one step -- no separate Office->PDF conversion step
# is needed, `markdownize_flow` does that internally.
#
# Projects that import genai-graph (e.g. ekg-atos, rfq_pricing) define their
# own presets (data paths, KG factory configs) in their own config/workflows/.
#
# Usage:
#   cli workflow run markdownize_documents --set sources=./docs --set md_output_dir=./md
#   cli workflow run document_to_kg --dry-run
#   cli workflow list
# ---------------------------------------------------------------------------

workflows:

  office2pdf_documents:
    description: "Convert Office documents (PowerPoint, Excel) to PDF"
    run: genai_tk.workflow.prefect.flows.office2pdf_flow.office2pdf_flow
    defaults:
      batch_size: 5
      cache_dir: null
    params:
      sources: {required: true}
      pdf_output_dir: {required: true}

  markdownize_documents:
    description: "Convert directories/zips/files (raw docs or pre-existing Markdown) to Markdown"
    run: genai_tk.workflow.markdownize.markdownize_flow
    defaults:
      batch_size: 5
      cache_dir: null
      profile: default
    params:
      sources: {required: true}
      md_output_dir: {required: true}

  document_to_kg:
    description: "End-to-end pipeline: documents (zip/dir/files) -> Markdown -> single-factory KG build"
    pipeline:
      - id: markdownize
        run: markdownize_documents
        with:
          sources: '${values.sources}'
          md_output_dir: '${values.md_output_dir}'
          cache_dir: '${values.cache_dir}'
          profile: '${values.profile}'
          force_stage: '${values.force_stage}'

      - id: create_kg
        run: kg_build
        after: [markdownize]
        with:
          graph: '${values.graph}'
          kg_name: '${values.kg_name}'
          delete_first: '${values.delete_first}'
          export_html: '${values.export_html}'
          force_stage: '${values.force_stage}'
    defaults:
      batch_size: 5
      cache_dir: null
      profile: default
      kg_name: inline
      delete_first: false
      export_html: true
    params:
      sources: {required: true}
      md_output_dir: {required: true}
      graph: {required: true}
