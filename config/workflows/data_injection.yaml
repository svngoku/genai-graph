# ---------------------------------------------------------------------------
# Data injection workflows  (DSL v2)
# ---------------------------------------------------------------------------
# Usage:
#   cli workflow run ppt2pdf_documents/rainbow --dry-run
#   cli workflow run full_kg_pipeline/rainbow --dry-run
#   cli workflow list
# ---------------------------------------------------------------------------

workflows:

  ppt2pdf_documents:
    description: "Convert PowerPoint files to PDF"
    run: genai_tk.workflow.prefect.flows.ppt2pdf_flow.ppt2pdf_flow
    defaults:
      batch_size: 5
    params:
      base_dir: {required: true}
      output_dir: {required: true}
    presets:
      rainbow:
        base_dir: '${paths.rainbow_ppt}'
        output_dir: '${paths.rainbow_pdf}'
        pathspecs: ['**/*.pptx', '**/*.ppt', '**/*.odp']
        batch_size: 5

  markdownize_documents:
    description: "Convert documents to Markdown format"
    run: genai_tk.workflow.prefect.flows.markdownize_flow.markdownize_flow
    defaults:
      batch_size: 5
    params:
      base_dir: {required: true}
      output_dir: {required: true}
    presets:
      rainbow:
        base_dir: '${paths.rainbow_pdf}'
        output_dir: '${paths.rainbow_md}'
        pathspecs: ['**/*.pdf']
        batch_size: 5
        converter: markitdown
      rfq:
        base_dir: '${paths.rfq_pdf}'
        output_dir: '${paths.rfq_md}'
        pathspecs: ['**/*.pdf']
        batch_size: 5
        converter: markitdown

  full_kg_pipeline:
    description: "End-to-end pipeline: PPT to PDF, Markdown, then KG creation"
    pipeline:
      - id: ppt_to_pdf
        run: ppt2pdf_documents
        with:
          base_dir: '${values.ppt_base_dir}'
          output_dir: '${values.pdf_output_dir}'
          pathspecs: ['**/*.pptx', '**/*.ppt', '**/*.odp']

      - id: markdownize
        run: markdownize_documents
        after: [ppt_to_pdf]
        with:
          base_dir: '${values.pdf_output_dir}'
          output_dir: '${values.md_output_dir}'
          pathspecs: ['**/*.pdf']

      - id: create_kg
        run: rainbow_add_crm
        after: [markdownize]
    defaults:
      batch_size: 5
      delete_first: false
      export_html: true
      force_rebuild: false
      converter: markitdown
    params:
      ppt_base_dir: {required: true}
      pdf_output_dir: {required: true}
      md_output_dir: {required: true}
    presets:
      rainbow:
        ppt_base_dir: '${paths.rainbow_ppt}'
        pdf_output_dir: '${paths.rainbow_pdf}'
        md_output_dir: '${paths.rainbow_md}'
        batch_size: 5
        converter: markitdown
