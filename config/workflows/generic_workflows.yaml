# ---------------------------------------------------------------------------
# Generic Knowledge Graph Workflows  (DSL v2)
#
# These workflows are domain-agnostic and can be used with any project that
# imports genai-graph.  For domain-specific workflows (e.g. EKG / Atos) see
# the project that imports genai-graph (e.g. ekg-atos).
#
# Usage:
#   cli workflow run document_graph --dry-run
#   cli workflow run document_graph --set data_dir=/path/to/docs
# ---------------------------------------------------------------------------

workflows:

  # --------------------------------------------------------------------------
  # Primitive: single factory build (hidden — used by higher-level workflows)
  # --------------------------------------------------------------------------
  kg_build:
    description: "Build a KG from a single graph factory configuration"
    run: genai_graph.orchestration.workflow_steps.kg_build_step
    hidden: true
    cache: manifest
    defaults:
      kg_name: inline
      delete_first: false
      export_html: true
      force_stage: null
    params:
      graph: {required: true}
      kg_name: {}
    artifacts:
      publish_result: true

  # --------------------------------------------------------------------------
  # Generic Document Nodes graph
  #
  # Scans a directory of text / markdown files and builds a graph of plain
  # Document nodes (no sections, no chunks). For a navigable heading hierarchy
  # use the `document_graph` workflow below instead.
  #
  # Required param:  data_dir   — path to directory to scan
  # Optional params: include    — list of glob patterns  (default: ['*.md','*.txt'])
  #                  exclude    — list of glob patterns to exclude
  #                  kg_name    — name for the output KG  (default: document_nodes)
  # --------------------------------------------------------------------------
  document_nodes:
    description: "Build a graph of Document nodes from a directory of text files"
    pipeline:
      - id: build
        run: kg_build
        with:
          kg_name: '${document_nodes.kg_name}'
          delete_first: '${document_nodes.delete_first}'
          export_html: '${document_nodes.export_html}'
          graph:
            factory: genai_graph.kg.factories.document_factory.DocumentDirectoryFactory
            data_root: '${document_nodes.data_dir}'
            include: '${document_nodes.include}'
            exclude: '${document_nodes.exclude}'
            recursive: true
    defaults:
      kg_name: document_nodes
      delete_first: false
      export_html: true
      data_dir: '${paths.data_root}/documents'
      include: ['*.md', '*.txt', '*.rst']
      exclude: []

  # --------------------------------------------------------------------------
  # Document Graph (heading hierarchy)
  #
  # Ingests a Markdown corpus into a Folder → Document → Section graph,
  # extracting each document's heading hierarchy as a navigable tree — no
  # chunking, no embeddings. An agent walks the tree via the tools in
  # genai_graph.kg.query.document_graph_tools instead of vector search.
  #
  # Required param:  sources    — list of directories, files, or .zip archives
  #                  db_path    — path to the Ladybug database file
  # Optional params: include    — glob patterns  (default: ['*.md'])
  #                  exclude    — glob patterns to exclude
  #                  recursive  — recurse into sub-directories (default: true)
  #                  force_stage — 'graph'/'all' rebuilds sections for re-ingested docs
  #                  delete_first — drop the Section tables before ingesting
  # --------------------------------------------------------------------------
  document_graph:
    description: "Build a Document Graph (Folder + Document + Section) from a corpus"
    run: genai_graph.orchestration.document_graph_flow.document_graph_build_step
    defaults:
      include: ['*.md']
      exclude: []
      recursive: true
      force_stage: null
      delete_first: false
    params:
      sources: {required: true}
      db_path: {required: true}
