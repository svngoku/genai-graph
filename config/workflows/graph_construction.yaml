# ---------------------------------------------------------------------------
# Generic KG build workflow definition  (DSL v2)
# ---------------------------------------------------------------------------
# This file defines the reusable kg_build primitive.
# Project-specific workflows (e.g. ekg-atos) extend this in their own
# config/workflows/ directory.
# ---------------------------------------------------------------------------

workflows:

  kg_build:
    description: "Build a KG from a single graph factory configuration"
    run: genai_graph.orchestration.workflow_steps.kg_build_step
    hidden: true
    cache: manifest
    defaults:
      kg_name: inline
      delete_first: false
      export_html: true
      force_rebuild: false
    params:
      graph: {required: true}
      kg_name: {}
  artifacts:
    publish_result: true
