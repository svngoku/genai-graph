# ---------------------------------------------------------------------------
# EKG Workflow definitions — Knowledge Graph build pipelines  (DSL v2)
# ---------------------------------------------------------------------------
# Usage:
#   cli workflow run one_rainbow --dry-run
#   cli workflow run learned --dry-run
#   cli workflow list
# ---------------------------------------------------------------------------

paths:
  rainbow_md: '${paths.ekg_data}/rainbow/md/'
  rainbow_json: '${paths.ekg_data}/rainbow/json/'
  rainbow_pdf: '${paths.ekg_data}/rainbow/pdf/'
  rainbow_ppt: '${paths.ekg_data}/rainbow/ppt/'
  add_json: '${paths.ekg_data}/arch_doc/json/'
  stratnav_db: '${paths.ekg_data}/stratnav'
  rfq_json: '${paths.ekg_data}/rfq/json/'
  rfq_md: '${paths.ekg_data}/rfq/md/'
  rfq_pdf: '${paths.ekg_data}/rfq/pdf/'

workflows:

  kg_build:
    description: "Build a KG from a single graph factory configuration"
    run: genai_graph.orchestration.workflow_steps.kg_build_step
    hidden: true
    cache: manifest
    defaults:
      kg_name: inline
      delete_first: false
      export_html: true
      force_rebuild: false
    params:
      graph: {required: true}
      kg_name: {}

  one_rainbow:
    description: "Single CNES TMA VENUS rainbow review"
    pipeline:
      - id: build
        run: kg_build
        with:
          kg_name: one_rainbow
          graph:
            factory: genai_graph.ekg.schema.rainbow_review.ReviewedOpportunityGraph
            data_root: '${paths.rainbow_json}'
            include: ['*CNES*TMA*VENUS*']
            exclude: [fake/*]
            recursive: true
            file_embedding:
              metadata:
                - Opportunity.opportunity_id
                - Customer.name
    defaults:
      delete_first: false
      export_html: true
      force_rebuild: false

  crm_export:
    description: "CRM export data ingestion"
    pipeline:
      - id: build
        run: kg_build
        with:
          kg_name: crm_export
          graph:
            factory: genai_graph.ekg.schema.crm_export.CrmExtractGraph
            files:
              - '${paths.ekg_data}/crm_export/report1750429630460_SHORTEN.xlsx'
            pd_read_parameters: {}
    defaults:
      delete_first: false
      export_html: true
      force_rebuild: false

  one_rainbow_with_db:
    description: "Rainbow review + CRM export with filter"
    pipeline:
      - id: rainbow
        run: kg_build
        with:
          kg_name: one_rainbow_with_db
          graph:
            factory: genai_graph.ekg.schema.rainbow_review.ReviewedOpportunityGraph
            data_root: '${paths.rainbow_json}'
            include: ['*CNES*TMA*VENUS*']
            exclude: [fake/*]
            recursive: true
      - id: crm
        run: kg_build
        after: [rainbow]
        with:
          kg_name: one_rainbow_with_db
          delete_first: false
          graph:
            factory: genai_graph.ekg.schema.crm_export.CrmExtractGraph
            files:
              - '${paths.ekg_data}/crm_export/report1750429630460_SHORTEN.xlsx'
            pd_read_parameters: {}
            filter_by_existing:
              node_label: Opportunity
              property: opportunity_id
    defaults:
      delete_first: false
      export_html: true
      force_rebuild: false

  rainbow_add_crm:
    description: "Rainbow reviews + architecture docs + CRM export"
    pipeline:
      - id: rainbow
        run: kg_build
        with:
          kg_name: rainbow_add_crm
          graph:
            factory: genai_graph.ekg.schema.rainbow_review.ReviewedOpportunityGraph
            data_root: '${paths.rainbow_json}'
            include: ['*CNES*']
            exclude: [fake/*]
            recursive: true
      - id: arch_doc
        run: kg_build
        after: [rainbow]
        with:
          kg_name: rainbow_add_crm
          delete_first: false
          graph:
            factory: genai_graph.ekg.schema.architecture_doc.ArchitectureDocumentGraph
            data_root: '${paths.add_json}'
            include: ['*CNES*']
            exclude: [fake/*]
            recursive: true
      - id: crm
        run: kg_build
        after: [arch_doc]
        with:
          kg_name: rainbow_add_crm
          delete_first: false
          graph:
            factory: genai_graph.ekg.schema.crm_export.CrmExtractGraph
            files:
              - '${paths.ekg_data}/crm_export/report1750429630460_SHORTEN.xlsx'
            pd_read_parameters: {}
            filter_by_existing:
              node_label: Opportunity
              property: opportunity_id
    defaults:
      delete_first: false
      export_html: true
      force_rebuild: false

  several_rainbow:
    description: "All rainbow review JSON files"
    pipeline:
      - id: build
        run: kg_build
        with:
          kg_name: several_rainbow
          graph:
            factory: genai_graph.ekg.schema.rainbow_review.ReviewedOpportunityGraph
            data_root: '${paths.rainbow_json}'
            include: ['*.json']
            recursive: true
    defaults:
      delete_first: false
      export_html: true
      force_rebuild: false

  stratnav_subset:
    description: "StratNav subset with embeddings"
    pipeline:
      - id: build
        run: kg_build
        with:
          kg_name: stratnav_subset
          graph:
            factory: genai_graph.ekg.schema.stratnav.StratnavGraph
            neo4j_export_file: '${paths.stratnav_db}/subset/sn-subset200.jsonl'
            embeddings:
              - field: L3.descriptionEmbedding
                model: ada_002@openrouter
    defaults:
      delete_first: false
      export_html: true
      force_rebuild: false

  stratnav_subset_rainbow_crm:
    description: "Rainbow + CRM + StratNav combined graph"
    pipeline:
      - id: rainbow_crm
        run: rainbow_add_crm
      - id: stratnav
        run: stratnav_subset
        after: [rainbow_crm]

  learned:
    description: "StratNav + Rainbow + CRM with learned similarity relationships"
    pipeline:
      - id: base
        run: stratnav_subset_rainbow_crm
      - id: similarities
        run: kg_build
        after: [base]
        with:
          kg_name: learned
          graph:
            factory: genai_graph.ekg.schema.learned_graph.L3TechApproachMatcher
            similarities:
              - relationship: POSSIBLE_OFFERING
                from: TechnicalApproach.architecture
                to: L3.description
                iterate_over: from
                threshold: 0.8
                top_k: 5
                combiner: first
    defaults:
      delete_first: false
      export_html: true
      force_rebuild: false
